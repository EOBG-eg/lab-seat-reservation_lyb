<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비밀번호 변경 - SW학과 실습실 좌석 예약 시스템</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8">
    <h1 class="text-xl font-bold text-slate-900 text-center mb-1">비밀번호 변경</h1>
    <p class="text-xs text-slate-500 text-center mb-6">{{ session['user_id'] }} {{ session['user_name'] }}</p>

    {% with messages = get_flashed_messages() %}
      {% if messages %}<div class="mb-4 p-3 rounded-lg bg-rose-50 border border-rose-200 text-rose-700 text-xs font-semibold">{{ messages[0] }}</div>{% endif %}
    {% endwith %}

    <form method="POST" action="/change_password" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">현재 비밀번호</label>
        <input type="password" name="current_password" required class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-indigo-600">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">새 비밀번호 (4자 이상)</label>
        <input type="password" name="new_password" required minlength="4" class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-indigo-600">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">새 비밀번호 확인</label>
        <input type="password" name="new_password2" required minlength="4" class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-indigo-600">
      </div>
      <div class="flex gap-2">
        <a href="{{ url_for('admin_dashboard') if is_admin else url_for('index') }}" class="flex-1 py-3 bg-slate-100 text-slate-600 text-center font-bold rounded-xl text-sm">취소</a>
        <button type="submit" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-sm">변경</button>
      </div>
    </form>
  </div>
</body>
</html>
