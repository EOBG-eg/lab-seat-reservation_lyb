<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 - SW학과 실습실 좌석 예약 시스템</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8">
    <div class="text-center mb-6">
      <span class="bg-indigo-100 text-indigo-700 text-xs font-bold px-3 py-1 rounded-full">경동대학교 소프트웨어학과</span>
      <h1 class="text-xl font-bold text-slate-900 mt-3">학생 회원가입</h1>
      <p class="text-xs text-slate-500 mt-1">학번과 이름으로 가입하면 바로 좌석을 예약할 수 있습니다.</p>
    </div>

    {% with messages = get_flashed_messages() %}
      {% if messages %}<div class="mb-4 p-3 rounded-lg bg-rose-50 border border-rose-200 text-rose-700 text-xs font-semibold">{{ messages[0] }}</div>{% endif %}
    {% endwith %}

    <form method="POST" action="/signup" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">학번 (숫자 7자리)</label>
        <input type="text" name="user_id" value="{{ form.user_id }}" required inputmode="numeric" pattern="\d{7}" maxlength="7" placeholder="예: 2221042"
               class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-indigo-600">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">이름</label>
        <input type="text" name="user_name" value="{{ form.user_name }}" required minlength="2" maxlength="20" placeholder="예: 홍길동"
               class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-indigo-600">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">비밀번호 (4자 이상)</label>
        <input type="password" name="password" required minlength="4" class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-indigo-600">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">비밀번호 확인</label>
        <input type="password" name="password2" required minlength="4" class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-indigo-600">
      </div>
      <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-sm transition">가입하기</button>
    </form>
    <p class="text-center text-xs text-slate-500 mt-4">이미 계정이 있으신가요? <a href="{{ url_for('login') }}" class="font-bold text-indigo-600 underline">로그인</a></p>
  </div>
</body>
</html>
