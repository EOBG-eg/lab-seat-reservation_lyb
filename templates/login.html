<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 - SW학과 실습실 좌석 예약 시스템</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8">
    <div class="text-center mb-6">
      <span class="bg-indigo-100 text-indigo-700 text-xs font-bold px-3 py-1 rounded-full">경동대학교 소프트웨어학과</span>
      <h1 class="text-xl font-bold text-slate-900 mt-3">실습실 좌석 예약 · 파일 보호 안내 시스템</h1>
      <p class="text-xs text-slate-500 mt-1">본인 학번 또는 교수/관리자 계정으로 로그인하세요.</p>
    </div>

    <!-- 알림 메시지 표시 -->
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="mb-4 p-3 rounded-lg bg-rose-50 border border-rose-200 text-rose-700 text-xs font-semibold">
          {{ messages[0] }}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST" action="/login" class="space-y-4">
      <input type="hidden" name="next" value="{{ next_url }}">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">학번 / 교번 (ID)</label>
        <input type="text" name="user_id" id="loginId" required placeholder="예: 2221042 또는 admin"
               class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-indigo-600">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">비밀번호 (Password)</label>
        <input type="password" name="password" id="loginPw" required placeholder="비밀번호 입력"
               class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-indigo-600">
      </div>
      <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-sm transition">
        로그인
      </button>
    </form>

    <p class="text-center text-xs text-slate-500 mt-4">계정이 없으신가요? <a href="{{ url_for('signup') }}" class="font-bold text-indigo-600 underline">학생 회원가입</a></p>

    <!-- 시연 편의를 위한 원클릭 계정 자동입력 버튼 -->
    <div class="mt-6 pt-5 border-t border-slate-100">
      <p class="text-xs font-bold text-slate-500 mb-2 text-center">💡 발표 시연용 빠른 계정 선택 (클릭 시 자동 입력)</p>
      <div class="grid grid-cols-2 gap-2 text-xs">
        <button onclick="fillLogin('2221042', '1234')" class="p-2 bg-slate-100 hover:bg-indigo-50 hover:text-indigo-700 rounded-lg font-semibold border border-slate-200">
          👨‍🎓 2221042 이유빈 (학생)
        </button>
        <button onclick="fillLogin('2221088', '1234')" class="p-2 bg-slate-100 hover:bg-indigo-50 hover:text-indigo-700 rounded-lg font-semibold border border-slate-200">
          👨‍🎓 2221088 김민수 (학생)
        </button>
        <button onclick="fillLogin('2221099', '1234')" class="p-2 bg-slate-100 hover:bg-indigo-50 hover:text-indigo-700 rounded-lg font-semibold border border-slate-200">
          👨‍🎓 2221099 박지훈 (학생)
        </button>
        <button onclick="fillLogin('admin', 'admin1234')" class="p-2 bg-amber-50 hover:bg-amber-100 text-amber-800 rounded-lg font-bold border border-amber-300">
          👨‍🏫 교수/조교 (관리자)
        </button>
      </div>
    </div>
  </div>

  <script>
    function fillLogin(id, pw) {
      document.getElementById('loginId').value = id;
      document.getElementById('loginPw').value = pw;
    }
  </script>
</body>
</html>
